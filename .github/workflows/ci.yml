name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install project
        run: uv sync --frozen

      - name: Compile check
        run: uv run python -m compileall -q firebridge tools main.py

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image and export tar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: firebridge:${{ github.sha }}
          outputs: type=docker,dest=/tmp/firebridge-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: firebridge-image-${{ github.sha }}
          path: /tmp/firebridge-image.tar
          retention-days: 14
          if-no-files-found: error
