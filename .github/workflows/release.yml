name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Compile & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install project
        run: uv sync --frozen

      - name: Compile check
        run: uv run python -m compileall -q firebridge tools main.py

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

  build-and-push:
    name: Build & push multi-arch image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="${prev}..${tag}"
            range_label="Changes since ${prev}"
          else
            range="${tag}"
            range_label="Initial release"
          fi

          {
            echo "## ${range_label}"
            echo
            git log --pretty=format:"- %s (%h)" "${range}"
            echo
            echo
            echo "## Contributors"
            echo
            git log --pretty=format:"%aN" "${range}" | sort -u | sed 's/^/- /'
            echo
            echo
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${{ steps.img.outputs.name }}:${version}"
            echo "docker pull ghcr.io/${{ steps.img.outputs.name }}:latest"
            echo '```'
          } > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
