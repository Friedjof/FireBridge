version: 1

id: open_url
kind: action
name: Open URL

mqtt:
  command_topic: ${base_topic}/url/set

ha:
  component: text
  object_id: open_url
  name: Open URL
  mode: text

inputs:
  url:
    type: text
    from_payload: true
    required: true

steps:
  - if:
      matches:
        value: ${url}
        pattern: ^https?://
      then: open
      else: invalid_url

  - id: open
    adb:
      args:
        - shell
        - am
        - start
        - -a
        - android.intent.action.VIEW
        - -d
        - ${url}

  - return: ${url}

  - id: invalid_url
    fail: URL must start with http:// or https://
