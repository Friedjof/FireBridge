version: 1

id: prod_media_volume
kind: action
name: Media Volume

mqtt:
  command_topic: ${base_topic}/media_volume/set
  state_topic: ${base_topic}/media_volume/state

ha:
  component: number
  object_id: media_volume
  name: Media Volume
  min: 0
  max: 15
  step: 1
  mode: slider

inputs:
  value:
    type: number
    min: 0
    max: 15
    from_payload: true
    required: true

steps:
  - adb: shell media volume --stream 3 --set ${value}
    description: Set media stream volume

  - publish:
      topic: ${mqtt.state_topic}
      payload: ${value}
      retain: true

  - return: ${value}
