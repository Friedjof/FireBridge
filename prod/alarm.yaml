version: 1

id: prod_alarm
kind: action
name: Alarm

# Schedules an alarm via Android's AlarmClock API
# (android.intent.action.SET_ALARM, handled by com.android.deskclock).
# SKIP_UI=true keeps the clock app off-screen.
#
# Two payload shapes are accepted on the same command topic:
#
#   1. Plain text — e.g. "07:30" — fires once at the next matching wall-clock
#      time, then auto-clears.
#
#   2. JSON — e.g.
#        {"time": "07:30", "days": "mo,di,fr", "label": "Aufstehen"}
#      `days` adds EXTRA_DAYS so the alarm repeats. Accepts named groups
#      (`daily`, `weekdays`, `weekend`), German short (mo,di,...), English
#      short (mon,tue,...), full names, or raw 1-7 (1=Sunday).
#      `label` adds EXTRA_MESSAGE — limited to letters, digits, spaces and
#      `_-.,:!?` so the value survives single-quote shell escaping safely.
#
# Note: the Android API does not support replacing an existing alarm — every
# call adds a new entry to the DeskClock list. Use prod_alarm_clear to wipe
# the list when you need to swap recurring alarms.

mqtt:
  command_topic: ${base_topic}/alarm/set
  state_topic: ${base_topic}/alarm/state

ha:
  component: text
  object_id: alarm
  name: Alarm
  mode: text
  icon: mdi:alarm

inputs:
  time:
    type: text
    from_payload: true
    payload_key: time
    required: true
  days:
    type: days
    from_payload: true
    payload_key: days
    default: ""
    required: false
  label:
    type: text
    from_payload: true
    payload_key: label
    default: ""
    required: false

steps:
  - if:
      matches:
        value: ${time}
        pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
      then: parse
      else: invalid_time

  - id: parse
    set:
      hour:
        regex:
          source: ${time}
          pattern: '^(\d{1,2}):'
          group: 1
          type: int
      minute:
        regex:
          source: ${time}
          pattern: ':(\d{2})$'
          group: 1
          type: int

  - if:
      matches:
        value: ${label}
        pattern: '^[\w \-.,:!?]*$'
      then: branch
      else: invalid_label

  - id: branch
    if:
      exists: ${days}
      then: schedule_recurring
      else: schedule_oneshot

  - id: schedule_oneshot
    adb:
      args:
        - shell
        - am
        - start
        - -a
        - android.intent.action.SET_ALARM
        - --ei
        - android.intent.extra.alarm.HOUR
        - ${hour}
        - --ei
        - android.intent.extra.alarm.MINUTES
        - ${minute}
        - --es
        - android.intent.extra.alarm.MESSAGE
        - "'${label}'"
        - --ez
        - android.intent.extra.alarm.SKIP_UI
        - "true"
    description: Schedule a one-shot alarm
    next: publish

  - id: schedule_recurring
    adb:
      args:
        - shell
        - am
        - start
        - -a
        - android.intent.action.SET_ALARM
        - --ei
        - android.intent.extra.alarm.HOUR
        - ${hour}
        - --ei
        - android.intent.extra.alarm.MINUTES
        - ${minute}
        - --eial
        - android.intent.extra.alarm.DAYS
        - ${days}
        - --es
        - android.intent.extra.alarm.MESSAGE
        - "'${label}'"
        - --ez
        - android.intent.extra.alarm.SKIP_UI
        - "true"
    description: Schedule a recurring alarm with EXTRA_DAYS

  - id: publish
    publish:
      topic: ${mqtt.state_topic}
      payload: ${time}
      retain: true

  - return: ${time}

  - id: invalid_time
    fail: Time must be in 24h HH:MM format (e.g. 07:30)

  - id: invalid_label
    fail: Label may only contain letters, digits, spaces and "_-.,:!?"
