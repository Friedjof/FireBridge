version: 1

id: example_battery_sensor
kind: sensor
name: Example Battery Sensor

schedule:
  cron: "* * * * *"
  run_on_start: true
  timezone: Europe/Berlin
  payload: READ

mqtt:
  command_topic: ${base_topic}/examples/battery/read
  state_topic: ${base_topic}/examples/battery/state

ha:
  component: sensor
  object_id: example_battery_sensor
  name: Example Battery
  device_class: battery
  state_class: measurement
  unit: "%"

steps:
  - adb: shell dumpsys battery
    capture: battery_dump
    description: Read battery dump

  - set:
      battery_level:
        regex:
          source: battery_dump
          pattern: "level:\\s*(\\d+)"
          group: 1
          type: int
          default: 0

  - publish:
      topic: ${mqtt.state_topic}
      payload: ${battery_level}
      retain: true

  - return: ${battery_level}
