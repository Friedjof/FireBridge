version: 1

id: example_brightness
kind: action
name: Example Brightness

mqtt:
  command_topic: ${base_topic}/examples/brightness/set
  state_topic: ${base_topic}/examples/brightness/state

ha:
  component: number
  object_id: example_brightness
  name: Example Brightness
  min: 0
  max: 255
  step: 1
  mode: slider

inputs:
  value:
    type: number
    min: 0
    max: 255
    from_payload: true
    required: true

steps:
  - adb: shell settings put system screen_brightness ${value}
    description: Set screen brightness

  - publish:
      topic: ${mqtt.state_topic}
      payload: ${value}
      retain: true

  - return: ${value}
